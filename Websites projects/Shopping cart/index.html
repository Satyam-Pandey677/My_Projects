<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="nav container">
            <a href="#" class="logo">Ecommerce</a>
            <i class='bx bxs-shopping-bag' id="cart-icon"></i>

            <div class="cart">
                
            </div>
        </nav>
    </header>

    <section class="shop container">
        <h2 class="section-title">Shop Products</h2>

        <div class="shop-content">
                <div class="product-box">
                    <img src="Essets/Shopping Cart img/product1.jpg" class="product-img">
                    <h2 class="product-title">AEROREADY SHIRT</h2>
                    <span class="price">$25</span>
                    <i class='bx bxs-shopping-bag' id="add-cart"></i>
                </div>

                <div class="product-box">
                    <img src="Essets/Shopping Cart img/product2.jpg" class="product-img">
                    <h2 class="product-title">Wireless Earbuds</h2>
                    <span class="price">$50</span>
                    <i class='bx bxs-shopping-bag' id="add-cart"></i>
                </div>

                <div class="product-box">
                    <img src="Essets/Shopping Cart img/product3.jpg" class="product-img">
                    <h2 class="product-title">Hooded Parka</h2>
                    <span class="price">$60</span>
                    <i class='bx bxs-shopping-bag' id="add-cart"></i>
                </div>

                <div class="product-box">
                    <img src="Essets/Shopping Cart img/product4.jpg" class="product-img">
                    <h2 class="product-title">Straw Metal Bottle</h2>
                    <span class="price">$70</span>
                    <i class='bx bxs-shopping-bag' id="add-cart"></i>
                </div>
                <div class="product-box">
                    <img src="Essets/Shopping Cart img/product5.jpg" class="product-img">
                    <h2 class="product-title">Metal Sunglasses</h2>
                    <span class="price">$90</span>
                    <i class='bx bxs-shopping-bag' id="add-cart"></i>
                </div>

                <div class="product-box">
                    <img src="Essets/Shopping Cart img/product6.jpg" class="product-img">
                    <h2 class="product-title">Black Hat</h2>
                    <span class="price">$15</span>
                    <i class='bx bxs-shopping-bag' id="add-cart"></i>
                </div>

                <div class="product-box">
                    <img src="Essets/Shopping Cart img/product7.jpg" class="product-img">
                    <h2 class="product-title">Backpack</h2>
                    <span class="price">$15</span>
                    <i class='bx bxs-shopping-bag' id="add-cart"></i>
                </div>

                <div class="product-box">
                    <img src="Essets/Shopping Cart img/product8.jpg" class="product-img">
                    <h2 class="product-title">Ultra Boost 22</h2>
                    <span class="price">$35</span>
                    <i class='bx bxs-shopping-bag' id="add-cart"></i>
                </div>
        </div>

    </section>
    <script src="script.js"></script>
</body>
</html>
